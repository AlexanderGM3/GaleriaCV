<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artistas - Galería Virtual</title>

    <link rel="icon" type="image/png" href="arte/calamardo1.jpg" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="artistas.css" />
</head>

<body>
    <header>
        <div class="logo">
            <a href="index.html"><img src="arte/360_F_432657539_7DuTQOx9Hux8E2yESHxKPWJX8sArkSDi.jpg"
                    alt="Logo Galería" /></a>
        </div>

        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="trabajos.html">Trabajos</a></li>
                <li><a href="artistas.html">Artistas</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>

        <div class="nav-right">
            <div class="user-menu">
                <i class="fa-solid fa-user" id="userIcon"></i>
                <div class="login-dropdown" id="loginDropdown">
                    <form id="loginForm">
                        <input type="email" id="loginEmail" placeholder="Correo electrónico" required />
                        <input type="password" id="loginPassword" placeholder="Contraseña" required />
                        <button type="submit">Iniciar sesión</button>
                    </form>
                    <p>O con Google</p>
                    <button id="googleLoginBtn" class="google-btn">
                        <i class="fa-brands fa-google"></i> Iniciar sesión con Google
                    </button>
                    <p>No tienes cuenta? <a href="registro.html">Regístrate</a></p>
                </div>
            </div>

            <div class="cart-icon" id="cartIcon">
                <i class="fa-solid fa-cart-shopping"></i>
                <div class="cart-dropdown" id="cartDropdown">
                    <p>Tu carrito está vacío por ahora.</p>
                </div>
            </div>
        </div>
    </header>

    <main class="artistas-container">
        <div class="arte-header">
            <h2>Búsqueda de Artistas</h2>
        </div>

        <div class="arte-tools">
            <div class="search-container">
                <input type="text" id="searchArtist" placeholder="Ejemplo: Leonardo da Vinci">
                <button id="btnBuscarArtista">Buscar</button>
            </div>
        </div>

        <div id="artistInfoBox">
            <img id="artistImage" src="" alt="">
            <p id="artistName"></p>
            <p id="artistBio"></p>
        </div>

        <h3>Artistas destacados</h3>
        <div class="artistas-grid" id="destacadosGrid"></div>
    </main>

    <footer>
        <div class="social">
            <a href="#"><i class="fab fa-facebook-f"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-twitter"></i></a>
            <a href="#"><i class="fab fa-youtube"></i></a>
        </div>
        <p>&copy; 2025 Galería Virtual | Todos los derechos reservados</p>
    </footer>

    <script type="module" src="supabase.js"></script>
    <script type="module" src="mainsesion.js"></script>
    <script src="artistas.js"></script>

</body>

</html>
